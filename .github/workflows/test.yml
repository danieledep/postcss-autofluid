name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The `engines` floor, the active LTS, and the current release.
        node: [20, 'lts/*', 'node']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Renders real Tailwind output in Chromium and compares computed styles with
  # plain Tailwind. The tooling is not a dependency of the package, so it is
  # installed here only, against the latest Tailwind 4 so a change in
  # Tailwind's output shape shows up as a failure.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright @tailwindcss/postcss@4 tailwindcss@4
      - run: npx playwright install --with-deps chromium
      - run: node --test test/browser.test.mjs
        env:
          BROWSER_TEST: 1
